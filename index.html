<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">  
    <title>Github App</title>
    <script src = "https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class ="flex flex-col gap-4">
    <select name = "language" id = "language" class="p-2 border border-gray-300 rounded">
        <option value="">Select a programming language</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
    </select>
    
    <button onclick = "fetchData( )" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Find repository</button>
    </div>
    <div class = "hidden">
        <a href="#" id="repo-link" target="_blank">View Repository</a>
        <p class = "repository"></p>
    </div>
    <script src = "script.js"></script>
</body>

</html>
